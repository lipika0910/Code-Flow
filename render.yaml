services:
  - type: web
    name: codeflow-web
    env: node
    plan: starter
    buildCommand: npm install && npm install --prefix server && npm install --prefix client && npm run build --prefix client && npm run db:migrate --prefix server && npm run db:seed --prefix server
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://codeflow.onrender.com
      - key: DB_CLIENT
        value: sqlite3
      - key: DB_FILENAME
        value: data/codeflow.sqlite3
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@codeflow.edu
      - key: ADMIN_PASSWORD
        generateValue: true

# To deploy with PostgreSQL instead of SQLite on Render:
# 1. Add a managed PostgreSQL instance under 'databases':
# databases:
#   - name: codeflow-db
#     plan: free
#     databaseName: codeflow
#     user: codeflow_user
# 2. In codeflow-web envVars, change:
#   - key: DB_CLIENT
#     value: pg
#   - key: DATABASE_URL
#     fromDatabase:
#       name: codeflow-db
#       property: connectionString
